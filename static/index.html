<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LegalChat — Эрх зүйн лавлах</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5eff'/%3E%3Ctext x='16' y='23' font-size='21' font-family='serif' font-weight='bold' fill='white' text-anchor='middle'%3E%C2%A7%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">§</span>
      <div>
        <h1>LegalChat</h1>
        <p id="brandSub">legalinfo.mn-ийн эх бичвэр дээр ажилладаг локал эрх зүйн туслах</p>
      </div>
    </div>
    <span class="status-badge" id="statusBadge" title="Ачаалж байна…">…</span>
  </header>

  <main class="layout">
    <!-- Зүүн тал: дэлгэрэнгүй мэдээлэл, холбогдох материал -->
    <section class="detail" id="detail" aria-live="polite">
      <div class="detail-bar" id="detailBar" hidden>
        <button type="button" class="ghost-btn" id="backBtn">← Олдсон материал</button>
        <span class="detail-bar-label" id="detailBarLabel"></span>
      </div>

      <div class="detail-scroll" id="detailScroll">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">§</div>
          <h2>Дэлгэрэнгүй мэдээлэл</h2>
          <p>
            Баруун талын чатаас асуултаа асууна уу. Агент индексээс олсон
            <span class="inline-link-demo">холбогдох материалыг</span> энд шууд
            жагсаах бөгөөд дээр нь дарвал тухайн заалт бүтэн эхээрээ нээгдэнэ.
          </p>
        </div>

        <section class="materials" id="materials" hidden></section>
        <article class="doc" id="doc" hidden></article>
      </div>
    </section>

    <!-- Баруун тал: чат -->
    <aside class="chat">
      <div class="chat-head">
        <h2>Чат</h2>
        <button type="button" id="clearBtn" class="ghost-btn">Цэвэрлэх</button>
      </div>

      <div class="messages" id="messages"></div>

      <div class="suggestions" id="suggestions"></div>

      <form class="composer" id="composer" autocomplete="off">
        <input
          id="input"
          type="text"
          placeholder="Асуултаа бичнэ үү…"
          aria-label="Асуулт"
          maxlength="500"
        />
        <button type="submit" id="sendBtn" aria-label="Илгээх">Илгээх</button>
        <button type="button" id="stopBtn" class="stop-btn" hidden>Зогсоох</button>
      </form>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
